[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gaia-dr4-explorer"
version = "0.1.0.dev0"
description = "Interactive explorer for Gaia DR4 epoch astrometry, one source at a time"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Vasily Belokurov" }]
dependencies = [
    # gaiasupdate 0.1.2 declares astropy<8.0; honour it explicitly.
    "astropy>=6.0,<8.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "pyarrow>=14",
    "platformdirs>=4.0",
    # gaiasupdate imports astroquery.gaia at module scope, so it is a base
    # dependency, not a later-phase one.
    "astroquery>=0.4.7",
    "gaiasupdate==0.1.2",
]

[project.optional-dependencies]
ui = ["panel>=1.4", "param>=2.0", "holoviews>=1.18", "hvplot>=0.9", "bokeh>=3.3"]
dev = ["pytest>=8.0", "pytest-cov", "ruff>=0.4"]

[project.scripts]
gaia-dr4-explorer = "gaia_dr4_explorer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The reference tables must travel in the wheel: the static browser build has
# no repository checkout to read them from.
"gaia_dr4_explorer.resources" = ["*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/ has no __init__.py, so "from tests.conftest import ..." needs the
# repository root on sys.path. Without this it works only where something else
# has already put it there, which is how it passed locally and failed in CI.
pythonpath = ["."]
markers = [
    "network: test requires internet access (deselected by default)",
    "integration: test uses the real prerelease dataset",
]
addopts = "-m 'not network' --strict-markers"

[tool.ruff]
line-length = 100
src = ["src", "tests", "static"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "NPY"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# The Pyodide entry point is a script, not a module.
"static/app.py" = ["E402"]

[tool.ruff.lint.isort]
# _bundled_data is generated by static/build.py and is not committed, so the
# sorter cannot see it on a clean checkout. Name it, or CI disagrees with a
# working tree that happens to have been built.
known-first-party = ["gaia_dr4_explorer", "_bundled_data"]
